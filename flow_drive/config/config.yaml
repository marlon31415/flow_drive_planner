data_processing:
  data_original_path: "/path/to/nuplan-v1.1/splits/trainval"
  map_original_path: "/path/to/maps"
  data_processed_path: "/path/to/already/saved/processed/data"
  data_processed_list:  "/path/to/already/saved/processed/data/scenarios_training.json"  # under the same folder as in the processed data
  normalization_file_path: null   # defaults to bundled flow_drive/config/normalization.json
  ego_future_clusters_path: null  # defaults to bundled flow_drive/config/ego_future_clusters.pkl
  data_processed_path_val: "/path/to/route/data/for/validation"
  route_data: "lg_routing_data.jsonl" # under the same folder as in the processed data
  route_index: "lg_routing_index.sqlite" # under the same folder as in the processed data
  agent_num: 32
  static_objects_num: 5
  predicted_neighbor_num: 10
  lane_num: 70
  lane_len: 20  # number of lane points
  past_time_horizon: 2  # with 10 hz
  future_time_horizon: 4  # with 10 hz
  augment_prob: 0.8
  augment_mode: "uniform"  # "uniform" or "truncated_gaussian"
  # sampling weights for scenarios
  weighted_sampling: True
  balance_mode: "cluster"  # "scenario_type" or "cluster"

encoder:
  agent_num: 32
  static_objects_num: 5
  lane_num: 70
  hidden_dim: 192
  encoder_depth: 3
  num_heads: 6
  time_len: 21
  lane_len: 20  # number of lane points
  static_objects_state_dim: 10
  encoder_drop_path_rate: 0.1
  decoder_drop_path_rate: 0.1
  route_pool_level: "step"  # "step" or "route" or "none" or "goal" or "points"
  route_fusion: "r2m"  # "m2r" or "r2m" map-to-route or route-to-map fusion
  route_fusion_binary: True # whether to use binary route fusion (only for r2m and m2r)
  max_route_steps: 3
  route_aux_loss: False
  use_spatial_attn_bias: False
  route_token_pool: "cls" # "cls" = self-attention over route tokens, "mean" = mean pooling over route tokens

diffuser:
  pred_horizon: 40
  timesteps_sampling_mode: "uniform"  # "uniform" or "lognorm"
  n_blocks: 3
  hidden_dim: 192
  num_heads: 6
  dropout: 0.1

inference:
  flow_train_iter: 2000
  flow_inference_iter: 8

train:
  seed: 33
  num_workers: 16
  pin_memory: True
  persistent_workers: True
  batch_size: 350
  num_epochs: 400
  ema_power: 0.99
  warmup_steps: 1500
  learning_rate: 0.0002
  lambda_route: 0.01
  route_pos_weight: 3.27 # route_pos_weight offsets the ~23% on-route class prior
  route_contested_weight: 1.0 # upweights lanes at a fork whose arms disagree about route membership (1.0 = off).
  weight_decay: 0.00001
